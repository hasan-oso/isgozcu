<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>İşGözcü — Canlı İzleme</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7;
    --green:#3fb950; --red:#f85149; --amber:#d29922;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  .app{display:flex;flex-direction:column;height:100vh;width:100vw}

  /* header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 22px;background:linear-gradient(180deg,#11161f,#0d1117);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:baseline;gap:12px}
  .logo{font-size:24px;font-weight:800;letter-spacing:.5px}
  .logo .i{color:var(--accent)}
  .brand .sub{color:var(--muted);font-size:13px}
  .status{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted)}
  .status .live{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:600}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--green)}
  .dot.fallback{background:var(--amber)}
  #clock{font-variant-numeric:tabular-nums}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);
       padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer}
  .btn:hover{background:#243049;border-color:#3d4d6b}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#3b8eff}

  /* main */
  main{flex:1;display:flex;gap:16px;padding:16px;min-height:0}
  .left{flex:1 1 70%;display:flex;flex-direction:column;gap:14px;min-width:0}
  .right{flex:0 0 30%;max-width:430px;display:flex;flex-direction:column;min-height:0}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .card .cn{color:var(--muted);font-size:13px;margin-bottom:6px}
  .card .cv{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .card.ok .cv{color:var(--green)}
  .card.bad .cv{color:var(--red)}
  .card.rate .cv{color:var(--accent)}

  /* stream */
  .stream{flex:1;min-height:0;background:#000;border:1px solid var(--border);
          border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
  .stream img{width:100%;height:100%;object-fit:contain;display:block}
  .stream .tag{position:absolute;top:12px;left:14px;background:rgba(0,0,0,.55);
               padding:4px 10px;border-radius:8px;font-size:12px;color:#cdd9e5}

  /* violation flow */
  .right h2{font-size:15px;margin:2px 4px 10px;color:var(--text)}
  .vflow{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
  .vflow::-webkit-scrollbar{width:8px}
  .vflow::-webkit-scrollbar-thumb{background:#30363d;border-radius:8px}
  .vcard{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);
         border-radius:12px;padding:11px 13px}
  .vcard.active{border-left-color:var(--red);background:linear-gradient(90deg,rgba(248,81,73,.10),var(--panel))}
  .vcard.ended{opacity:.42;border-left-color:var(--muted)}
  .vcard .vt{font-weight:700;font-size:15px}
  .vcard.active .vt{color:var(--red)}
  .vcard .vmeta{color:var(--muted);font-size:12.5px;margin-top:4px}
  .vcard .vtime{color:#6e7681;font-size:11.5px;margin-top:3px}
  .vcard .thumb{width:100%;max-height:96px;object-fit:cover;border-radius:8px;margin-top:9px;border:1px solid var(--border)}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--border);border-radius:12px}

  /* footer */
  footer{padding:8px 22px;border-top:1px solid var(--border);background:#0b0f16;
         color:var(--muted);font-size:12.5px;text-align:center;letter-spacing:.3px}
  footer b{color:var(--green);font-weight:600}

  /* ---------------------------------------------------------------------
     Motion layer — ALL animation/transition lives here so it is fully
     disabled for users who prefer reduced motion. transform/opacity only
     (plus a faint box-shadow for the active-violation pulse). Subtle by
     design: slow ~2s cycles, low opacity, no fast flashing / neon.
     --------------------------------------------------------------------- */
  @media (prefers-reduced-motion: no-preference){
    .btn{transition:background .15s, border-color .15s}
    .card .cv{transition:color .3s}
    .dot{animation:pulse 2s ease-in-out infinite}
    .dot.fallback{animation:pulseA 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}50%{box-shadow:0 0 0 7px rgba(63,185,80,0)}}
    @keyframes pulseA{0%,100%{box-shadow:0 0 0 0 rgba(210,153,34,.5)}50%{box-shadow:0 0 0 7px rgba(210,153,34,0)}}

    /* violation cards: gentle slide+fade in, smooth fade out, calm active pulse */
    .vcard{transition:transform .3s ease-out, opacity .3s ease-out, box-shadow .4s ease, border-color .3s ease}
    .vcard.enter{opacity:0;transform:translateY(-8px)}
    .vcard.active{animation:pulseBorder 2.2s ease-in-out infinite}
    @keyframes pulseBorder{
      0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,0)}
      50%{box-shadow:0 0 0 3px rgba(248,81,73,.16)}
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="logo">İş<span class="i">Gözcü</span></span>
      <span class="sub">Şantiye Güvenlik İzleme</span>
    </div>
    <div class="status">
      <span class="live"><span class="dot" id="dot"></span> <span id="modeLabel">Canlı</span> · <span id="src">Kamera 1</span></span>
      <span id="clock">--:--:--</span>
      <button class="btn" id="btnSound" title="İhlal sesi">Ses: Kapalı</button>
      <button class="btn" id="btnSource" title="Canlı ↔ Yedek video">Kaynak değiştir</button>
      <button class="btn primary" id="btnFull">Tam ekran</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="cards">
        <div class="card"><div class="cn">Toplam işçi</div><div class="cv" id="c-workers">0</div></div>
        <div class="card ok"><div class="cn">Kurallara uyan</div><div class="cv" id="c-ok">0</div></div>
        <div class="card bad"><div class="cn">İhlal</div><div class="cv" id="c-viol">0</div></div>
        <div class="card rate"><div class="cn">Uyum oranı</div><div class="cv" id="c-rate">%100</div></div>
      </div>
      <div class="stream">
        <img id="stream" src="/stream" alt="Canlı yayın" />
        <span class="tag" id="fpsTag">FPS —</span>
      </div>
    </section>

    <aside class="right">
      <h2>İhlal akışı</h2>
      <div id="vflow" class="vflow"><div class="empty">Aktif ihlal yok</div></div>
    </aside>
  </main>

  <footer>Yerel mod · <b>KVKK uyumlu</b> · Yüz tanıma yok · Anonim takip (ByteTrack)</footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  const reducedMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // live clock (Turkish locale)
  const tickClock = () => { $("clock").textContent = new Date().toLocaleTimeString("tr-TR"); };
  setInterval(tickClock, 1000); tickClock();

  // fullscreen (true kiosk look)
  $("btnFull").onclick = () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  };

  // manual source switch (rehearsal / emergency)
  $("btnSource").onclick = async () => {
    const b = $("btnSource");
    b.disabled = true; b.textContent = "Değiştiriliyor…";
    try { await fetch("/toggle-source", { method: "POST" }); } catch (e) {}
    setTimeout(() => { b.disabled = false; b.textContent = "Kaynak değiştir"; }, 1200);
  };

  /* ---- optional, muted-by-default alert tone (Web Audio, no external files) ---- */
  let soundOn = false, audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playTone(){
    if (!soundOn || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.value = 660;        // soft, single tone
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.02); // low level, gentle attack
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15); // ~150 ms
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.16);
  }
  $("btnSound").onclick = () => {
    soundOn = !soundOn;
    if (soundOn) ensureAudio();                          // create/resume on user gesture
    $("btnSound").textContent = "Ses: " + (soundOn ? "Açık" : "Kapalı");
    $("btnSound").classList.toggle("primary", soundOn);
  };

  // MJPEG stream auto-plays in <img>; retry on error/disconnect
  const img = $("stream");
  img.onerror = () => setTimeout(() => { img.src = "/stream?t=" + Date.now(); }, 1500);

  /* ---- smooth count-up for the 4 metric cards (presentation only) ---- */
  const counters = {}, animTokens = {};
  function animateCount(id, target, prefix = ""){
    target = Math.round(target);
    const el = $(id);
    const from = (counters[id] === undefined) ? target : counters[id];
    counters[id] = target;
    if (from === target || reducedMotion){ el.textContent = prefix + target; return; }
    const token = (animTokens[id] = (animTokens[id] || 0) + 1);
    const dur = 400, t0 = performance.now();
    function step(now){
      if (animTokens[id] !== token) return;              // superseded by a newer value
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = prefix + Math.round(from + (target - from) * p);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---- violation flow: keyed DOM diff so entrance animates once, ended fades ---- */
  const vflow = $("vflow");
  const tracked = new Map();      // key -> {data, endedAt|null}
  const cardEls = new Map();      // key -> DOM element
  const announced = new Set();    // keys already chimed for
  const vkey = v => v.track_id + "|" + v.type_tr;

  function cardHTML(v, ended){
    const conf = Math.round((v.confidence || 0) * 100);
    const thumb = v.snapshot ? `<img class="thumb" src="${v.snapshot}" alt="kanıt görüntüsü" loading="lazy">` : "";
    return `<div class="vt">${v.type_tr}${ended ? " · sona erdi" : ""}</div>
      <div class="vmeta">İşçi #${v.track_id} · süre ${v.duration}s · güven %${conf}</div>
      <div class="vtime">Başlangıç ${v.started}</div>
      ${thumb}`;
  }

  function renderViolations(viols){
    const now = Date.now();
    const activeKeys = new Set(viols.map(vkey));
    viols.forEach(v => tracked.set(vkey(v), { data: v, endedAt: null }));
    for (const [k, e] of tracked){
      if (!activeKeys.has(k) && e.endedAt === null) e.endedAt = now;
      if (e.endedAt !== null && now - e.endedAt > 5000) tracked.delete(k);
    }
    // chime once per genuinely new active violation
    for (const k of activeKeys){ if (!announced.has(k)){ announced.add(k); playTone(); } }
    for (const k of [...announced]){ if (!activeKeys.has(k)) announced.delete(k); }

    if (tracked.size === 0){
      cardEls.forEach(el => el.remove()); cardEls.clear();
      if (!vflow.querySelector(".empty")) vflow.innerHTML = '<div class="empty">Aktif ihlal yok</div>';
      return;
    }
    const empty = vflow.querySelector(".empty"); if (empty) empty.remove();

    for (const [k, e] of tracked){
      const ended = e.endedAt !== null;
      let el = cardEls.get(k);
      if (!el){
        el = document.createElement("div");
        el.className = "vcard enter " + (ended ? "ended" : "active");
        el.innerHTML = cardHTML(e.data, ended);
        vflow.insertBefore(el, vflow.firstChild);        // newest on top
        cardEls.set(k, el);
        // drop .enter on the next frames so it transitions to rest (once)
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("enter")));
      } else {
        el.className = "vcard " + (ended ? "ended" : "active");
        el.innerHTML = cardHTML(e.data, ended);
      }
    }
    for (const [k, el] of cardEls){ if (!tracked.has(k)){ el.remove(); cardEls.delete(k); } }
  }

  function applyHealth(h){
    if (!h) return;
    const fallback = h.mode === "fallback";
    $("dot").classList.toggle("fallback", fallback);
    $("modeLabel").textContent = fallback ? "Yedek" : "Canlı";
    if (h.source) $("src").textContent = h.source;
  }

  // ---- data fetching from /stats + /health (UNCHANGED logic) ----
  async function poll(){
    try{
      const [sr, hr] = await Promise.all([
        fetch("/stats", { cache: "no-store" }),
        fetch("/health", { cache: "no-store" }),
      ]);
      const s = await sr.json();
      applyHealth(await hr.json());
      const workers = s.workers || 0;
      const viols = s.violations || [];
      const violators = new Set(viols.map(v => v.track_id));
      const uyan = Math.max(0, workers - violators.size);
      const rate = workers > 0 ? Math.round(uyan / workers * 100) : 100;
      // presentation layer (smooth count-up instead of abrupt textContent)
      animateCount("c-workers", workers);
      animateCount("c-ok", uyan);
      animateCount("c-viol", s.active_violations || 0);
      animateCount("c-rate", rate, "%");
      $("fpsTag").textContent = "FPS " + (s.fps ?? "—");
      renderViolations(viols);
    }catch(e){ /* keep last values on transient error */ }
  }
  setInterval(poll, 1000); poll();
</script>
</body>
</html>
